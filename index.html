<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p6 tarjeta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
body {
    margin: 0;
    min-height: 100vh;
    background-color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.tarjeta {
    width: 580px;
    max-width: 95%;
    height: 380px;
    padding: 10px;
    background-color: white;
    border-radius: 30px;
    border: 2px solid black;
    display: flex;
    gap: 15px;
    box-sizing: border-box;
}


.imagen {
    width: 50%;
    height: 100%;
    object-fit: cover;
    border-radius: 25px;
}


.informacion {
    width: 50%;
    min-width: 0;
    padding: 15px 5px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.informacion p {
    margin: 0;
}


h2 {
    font-size: 22px;
    margin: 0;
}

.subtitulo {
    font-size: 12px;
    color: #aaaaaa;
}

.precio {
    font-size: 14px;
    color: black;
}


.formas {
    display: flex;
    align-items: center;
    gap: 10px;
}


.rectangulo {
    background-color: black;
    color: white;
    border-radius: 20px;
    padding: 12px 10px;
    flex: 1;
    text-align: center;
    font-size: 12px;
}


.circulo {
    width: 30px;
    height: 30px;
    border: 1px solid #cccccc;
    border-radius: 50%;
    background-color: white;
    flex-shrink: 0;
}

@media (max-width: 600px) {
    .tarjeta {
        width: 90%;
        height: auto;
        flex-direction: column;
    }

    .imagen {
        width: 100%;
        height: 220px;
    }

    .informacion {
        width: 100%;
        box-sizing: border-box;
        gap: 10px;
    }
}

    </style>
</head>
<body>
  <div class="tarjeta">

        <img src="https://cdn.sanity.io/images/nxpteyfv/goguides/55ce7ed16b27ee9a4fb230b61c71c76ceb5efce0-1600x1066.jpg" alt="San Francisco" class="imagen">

        <div class="informacion">

    <div class="textos">
        <h2>San Francisco</h2>
        <p class="subtitulo">Premium economy</p>
        <p class="precio">From 240€</p>
    </div>

    <div class="formas">
        <div class="rectangulo">
            search flighy
        </div>

        <div class="circulo"></div>
    </div>

        </div>

    </div>
</body>
</html>
